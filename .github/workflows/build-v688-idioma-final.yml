name: Build Monstrinhos v6.8.8 Idioma Unico
on:
  push:
    branches: [ "chatgpt/monstrinhos-v6.8.8-idioma-final" ]
  workflow_dispatch:

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild v6.8.7 baseline
        shell: bash
        run: |
          set -euo pipefail
          cat ci/tcc670_chunk_*.txt > "$RUNNER_TEMP/base.b64"
          base64 -d "$RUNNER_TEMP/base.b64" > "$RUNNER_TEMP/base.zip"
          mkdir -p "$RUNNER_TEMP/mon"
          unzip -q "$RUNNER_TEMP/base.zip" -d "$RUNNER_TEMP/mon"
          for p in 681 682 683 684 685 686 687; do
            base64 -d "ci/patch$p.b64" > "$RUNNER_TEMP/patch$p.zip"
            unzip -oq "$RUNNER_TEMP/patch$p.zip" -d "$RUNNER_TEMP/mon"
          done

      - name: Apply v6.8.8 language-only source patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mon"
          python3 - <<'PY_EOF'
          from pathlib import Path
          
          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding="utf-8")
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {n}")
              p.write_text(s.replace(old,new,1),encoding="utf-8")
          
          replace_once("app/build.gradle",
          """        versionCode 6870
                  versionName '6.8.7'""",
          """        versionCode 6880
                  versionName '6.8.8'""")
          
          replace_once("app/src/main/AndroidManifest.xml",
          'android:label="Monstrinhos TCC 6.8.7 IDIOMA LIMPO"',
          'android:label="Monstrinhos TCC 6.8.8 IDIOMA ÚNICO"')
          
          view="app/src/main/java/com/caeless/monstrinhos/MonstrinhosView.java"
          replace_once(view,
          """    private int activeTarget=0, selectedMonster=0, albumPage=0;
              private String reaction="";""",
          """    private int activeTarget=0, selectedMonster=0, albumPage=0;
              private boolean languageMenuOpen=false;
              private String reaction="";""")
          
          replace_once(view,
          """    private void languagePill(Canvas c,String label,float l,float t,float r,float b){
                  // Preserva a cápsula/ícone impressos na arte; cobre somente a palavra do idioma.
                  float tl=l+(r-l)*.08f,tr=r-(r-l)*.26f,tt=t+(b-t)*.17f,tb=b-(b-t)*.16f;
                  float rad=(tb-tt)*.38f;
                  p.setShader(new LinearGradient(0,tt,0,tb,0xFFFFFBF1,0xFFFFEED7,Shader.TileMode.CLAMP));
                  c.drawRoundRect(tl,tt,tr,tb,rad,rad,p);p.setShader(null);
                  textFit(c,label,(tl+tr)/2,tt+(tb-tt)*.68f,16.5f,12.5f,(tr-tl)*.90f,0xFF6A351B);
              }""",
          """    private void languagePill(Canvas c,String label,float l,float t,float r,float b){
                  // v6.8.8: a cápsula, borda e seta existem somente na arte-base.
                  // O JPG já vem com a palavra original removida; aqui desenhamos APENAS o estado textual.
                  float textLeft=l+(r-l)*.10f, textRight=r-(r-l)*.28f;
                  textFit(c,label,(textLeft+textRight)/2,t+(b-t)*.61f,16.5f,12.5f,(textRight-textLeft)*.94f,0xFF6A351B);
              }
              private void drawLanguageMenu(Canvas c,float w,float h){
                  if(!languageMenuOpen)return;
                  // Seletor temático desenhado no mesmo Canvas: nenhuma View/Spinner/PopupWindow Android é criada.
                  float l=w*.555f,r=w*.895f,t=h*.565f,b=h*.635f,rad=h*.018f;
                  p.setShader(new LinearGradient(0,t,0,b,0xFFFFF6DF,0xFFFFDDA8,Shader.TileMode.CLAMP));
                  c.drawRoundRect(l,t,r,b,rad,rad,p);p.setShader(null);
                  p.setStyle(Paint.Style.STROKE);p.setStrokeWidth(2.4f);p.setColor(0xFFB45A35);c.drawRoundRect(l,t,r,b,rad,rad,p);p.setStyle(Paint.Style.FILL);
                  String[] names={"Português","English","Español"};
                  float row=(b-t)/3f;
                  for(int i=0;i<3;i++){
                      if(i==s.languageIndex){p.setColor(0x33E75A6A);c.drawRoundRect(l+4,t+i*row+2,r-4,t+(i+1)*row-2,rad*.45f,rad*.45f,p);}
                      textFit(c,names[i],(l+r)/2,t+(i+.69f)*row,14.5f,11.5f,(r-l)*.84f,0xFF6A351B);
                      if(i<2){p.setColor(0x55B45A35);c.drawRect(l+w*.025f,t+(i+1)*row,r-w*.025f,t+(i+1)*row+1,p);}
                  }
              }""")
          
          replace_once(view,'text(c,"v6.8.7 UI",w*.91f,h*.988f,8,0xCCFFFFFF);',
                            'text(c,"v6.8.8 UI",w*.91f,h*.988f,8,0xCCFFFFFF);')
          
          replace_once(view,
          """        languagePill(c,s.languageName(),w*.625f,h*.641f,w*.872f,h*.694f);
                  drawReaction(c,w,h);""",
          """        languagePill(c,s.languageName(),w*.625f,h*.641f,w*.872f,h*.694f);
                  drawLanguageMenu(c,w,h);
                  drawReaction(c,w,h);""")
          
          replace_once(view,
          'tr("Versão funcional 6.8.7","Functional version 6.8.7","Versión funcional 6.8.7")',
          'tr("Versão funcional 6.8.8","Functional version 6.8.8","Versión funcional 6.8.8")')
          
          replace_once(view,
          """                if(y>h*.63f&&y<h*.72f){s.cycleLanguage(getContext());setContentDescription(tr("Monstrinhos. Jogo infantil com fases, coleção, ovos e casinha.","Monstrinhos. Children’s game with stages, collection, eggs and house.","Monstrinhos. Juego infantil con fases, colección, huevos y casita."));reaction="";reactionUntil=0L;break;}""",
          """                if(languageMenuOpen){
                              if(x>w*.555f&&x<w*.895f&&y>h*.565f&&y<h*.635f){
                                  int pick=clamp((int)((y-h*.565f)/(h*.070f/3f)),0,2);
                                  s.languageIndex=pick;s.save(getContext());languageMenuOpen=false;
                                  setContentDescription(tr("Monstrinhos. Jogo infantil com fases, coleção, ovos e casinha.","Monstrinhos. Children’s game with stages, collection, eggs and house.","Monstrinhos. Juego infantil con fases, colección, huevos y casita."));
                                  reaction="";reactionUntil=0L;invalidate();break;
                              }
                              languageMenuOpen=false;invalidate();break;
                          }
                          if(y>h*.63f&&y<h*.72f){languageMenuOpen=true;reaction="";reactionUntil=0L;invalidate();break;}""")
          
          replace_once("tools/verify_release.py",
          """'version':'versionCode 6870' in text and "versionName '6.8.7'" in text,
          'label':'Monstrinhos TCC 6.8.7 IDIOMA LIMPO' in text,""",
          """'version':'versionCode 6880' in text and "versionName '6.8.8'" in text,
          'label':'Monstrinhos TCC 6.8.8 IDIOMA ÚNICO' in text,""")
          
          Path("RELEASE_NOTES_v6.8.8_IDIOMA_UNICO.md").write_text("""# Monstrinhos v6.8.8 — Idioma Único
          
          Atualização pontual a partir da v6.8.7 IDIOMA LIMPO.
          
          - Mantém package com.caeless.monstrinhos, targetSdk 36 e save monstrinhos_save_v1.
          - Corrige somente o seletor de idioma em Ajustes.
          - A cápsula visual existe uma única vez na arte original.
          - O texto selecionado é desenhado uma única vez: Português, English ou Español.
          - O seletor temático é desenhado pelo próprio Canvas do jogo, sem Spinner, PopupWindow, Toast ou View adicional.
          - Som, Música, Vibração, gameplay, mapa, casinha, álbum, ovos, conquistas, HUD, economia, AdMob e Billing não foram alterados.
          """,encoding="utf-8")
          
          PY_EOF

      - name: Clean baked language text from original art
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mon"
          cat > "$RUNNER_TEMP/PatchSettings.java" <<'JAVA_EOF'
          import java.awt.image.BufferedImage;
          import java.io.File;
          import java.util.Iterator;
          import javax.imageio.*;
          import javax.imageio.stream.ImageOutputStream;
          
          public class PatchSettings {
            static int average(BufferedImage img, int x1, int x2, int y) {
              long r=0,g=0,b=0; int n=0;
              for (int x=x1; x<=x2; x++) {
                int c=img.getRGB(x,y);
                r+=(c>>16)&255; g+=(c>>8)&255; b+=c&255; n++;
              }
              return (255<<24)|(((int)(r/n))<<16)|(((int)(g/n))<<8)|((int)(b/n));
            }
            static int mix(int a,int b,double t) {
              int ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
              int br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
              int r=(int)Math.round(ar+(br-ar)*t);
              int g=(int)Math.round(ag+(bg-ag)*t);
              int bl=(int)Math.round(ab+(bb-ab)*t);
              return (255<<24)|(r<<16)|(g<<8)|bl;
            }
            public static void main(String[] args) throws Exception {
              File f=new File(args[0]);
              BufferedImage img=ImageIO.read(f);
              if (img.getWidth()!=864 || img.getHeight()!=1536)
                throw new IllegalStateException("Unexpected settings artwork size");
              for (int y=1005; y<1045; y++) {
                int left=average(img,548,554,y);
                int right=average(img,691,699,y);
                for (int x=555; x<=690; x++) {
                  double t=(x-555)/135.0;
                  img.setRGB(x,y,mix(left,right,t));
                }
              }
              Iterator<ImageWriter> it=ImageIO.getImageWritersByFormatName("jpeg");
              ImageWriter writer=it.next();
              ImageWriteParam param=writer.getDefaultWriteParam();
              param.setCompressionMode(ImageWriteParam.MODE_EXPLICIT);
              param.setCompressionQuality(0.95f);
              try(ImageOutputStream out=ImageIO.createImageOutputStream(f)){
                writer.setOutput(out);
                writer.write(null,new IIOImage(img,null,null),param);
              } finally { writer.dispose(); }
            }
          }
          JAVA_EOF
          javac "$RUNNER_TEMP/PatchSettings.java"
          java -cp "$RUNNER_TEMP" PatchSettings app/src/main/res/drawable-nodpi/tcc_settings.jpg

      - name: Source QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mon"
          python3 tools/verify_release.py
          ! grep -R -E 'Spinner|PopupWindow|Toast\.makeText|addView\(' app/src/main/java
          grep -F 'private boolean languageMenuOpen=false;' app/src/main/java/com/caeless/monstrinhos/MonstrinhosView.java
          grep -F 'languagePill(c,s.languageName()' app/src/main/java/com/caeless/monstrinhos/MonstrinhosView.java
          grep -F 'drawLanguageMenu(c,w,h);' app/src/main/java/com/caeless/monstrinhos/MonstrinhosView.java
          grep -F 's.languageIndex=pick;s.save(getContext());languageMenuOpen=false;' app/src/main/java/com/caeless/monstrinhos/MonstrinhosView.java
          grep -F 'String[] names={"Português","English","Español"};' app/src/main/java/com/caeless/monstrinhos/MonstrinhosView.java

      - name: Configure stable test signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -importkeystore -noprompt \
            -srckeystore "$GITHUB_WORKSPACE/app/keystores/monstrinhos-test.jks" \
            -srcstorepass 'monstrinhos-test-only-2026' \
            -srcalias 'monstrinhos-test' \
            -srckeypass 'monstrinhos-test-only-2026' \
            -destkeystore "$HOME/.android/debug.keystore" \
            -deststorepass 'android' \
            -destkeypass 'android' \
            -destalias 'androiddebugkey'

      - name: Build APK
        run: cd "$RUNNER_TEMP/mon" && gradle :app:assembleDebug --stacktrace

      - name: Verify APK identity alignment signature and archive
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mon"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$RUNNER_TEMP/out"
          "$BT/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "name='com.caeless.monstrinhos'" "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "versionCode='6880'" "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "versionName='6.8.8'" "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "application-label:'Monstrinhos TCC 6.8.8 IDIOMA ÚNICO'" "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "targetSdkVersion:'36'" "$RUNNER_TEMP/out/BADGING.txt"
          "$BT/zipalign" -c -v 4 "$APK" | tee "$RUNNER_TEMP/out/ZIPALIGN.txt"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/out/SIGNATURE.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: f562b57aa046dbb098922a6dc520f3ff8e1ad190d129c7e61a254588646ce514' "$RUNNER_TEMP/out/SIGNATURE.txt"
          unzip -t "$APK" | tee "$RUNNER_TEMP/out/ZIPTEST.txt"
          cp "$APK" "$RUNNER_TEMP/out/Monstrinhos_v6.8.8_IDIOMA_UNICO.apk"
          sha256sum "$RUNNER_TEMP/out/Monstrinhos_v6.8.8_IDIOMA_UNICO.apk" > "$RUNNER_TEMP/out/SHA256SUMS.txt"

      - name: Export consolidated source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mon"
          zip -qr "$RUNNER_TEMP/out/Monstrinhos_v6.8.8_IDIOMA_UNICO_source.zip" . -x 'app/build/*' '.gradle/*' 'build/*'
          sha256sum "$RUNNER_TEMP/out/Monstrinhos_v6.8.8_IDIOMA_UNICO_source.zip" >> "$RUNNER_TEMP/out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Monstrinhos-v6.8.8-IDIOMA-UNICO
          path: ${{ runner.temp }}/out/*
          retention-days: 7
