name: Build Monstrinhos v6.8.8 Idioma Final
on:
  push:
    branches: [ "chatgpt/monstrinhos-v6.8.8-idioma-final" ]
  workflow_dispatch:

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild v6.8.7 and apply v6.8.8 patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/tcc670_chunk_*.txt > "$RUNNER_TEMP/base.b64"
          base64 -d "$RUNNER_TEMP/base.b64" > "$RUNNER_TEMP/base.zip"
          mkdir -p "$RUNNER_TEMP/mon"
          unzip -q "$RUNNER_TEMP/base.zip" -d "$RUNNER_TEMP/mon"
          for p in 681 682 683 684 685 686 687; do
            base64 -d "ci/patch${p}.b64" > "$RUNNER_TEMP/patch${p}.zip"
            unzip -oq "$RUNNER_TEMP/patch${p}.zip" -d "$RUNNER_TEMP/mon"
          done
          cd "$RUNNER_TEMP/mon"
          patch -p1 < "$GITHUB_WORKSPACE/ci/v688.patch"
          cp "$GITHUB_WORKSPACE/ci/v688.patch" V688_SOURCE_DIFF.patch
          python3 tools/verify_release.py
          ! grep -R -E 'Spinner|PopupWindow|Toast\.makeText|addView\(' app/src/main/java
          grep -F 'private boolean languageMenuOpen=false;' app/src/main/java/com/caeless/monstrinhos/MonstrinhosView.java
          grep -F 'drawLanguageMenu(c,w,h);' app/src/main/java/com/caeless/monstrinhos/MonstrinhosView.java
          grep -F 's.setLanguage(getContext(),lang);' app/src/main/java/com/caeless/monstrinhos/MonstrinhosView.java
          grep -F 'void setLanguage(Context c,int index)' app/src/main/java/com/caeless/monstrinhos/GameState.java

      - name: Configure stable test signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -importkeystore -noprompt \
            -srckeystore "$GITHUB_WORKSPACE/app/keystores/monstrinhos-test.jks" \
            -srcstorepass 'monstrinhos-test-only-2026' \
            -srcalias 'monstrinhos-test' \
            -srckeypass 'monstrinhos-test-only-2026' \
            -destkeystore "$HOME/.android/debug.keystore" \
            -deststorepass 'android' \
            -destkeypass 'android' \
            -destalias 'androiddebugkey'

      - name: Build APK
        run: cd "$RUNNER_TEMP/mon" && gradle :app:assembleDebug --stacktrace

      - name: Verify APK identity, alignment and signature
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mon"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)"
          test -n "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$RUNNER_TEMP/out"
          "$BT/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "name='com.caeless.monstrinhos'" "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "versionCode='6880'" "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "versionName='6.8.8'" "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "application-label:'Monstrinhos TCC 6.8.8 IDIOMA FINAL'" "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "targetSdkVersion:'36'" "$RUNNER_TEMP/out/BADGING.txt"
          "$BT/zipalign" -c -v 4 "$APK" | tee "$RUNNER_TEMP/out/ZIPALIGN.txt"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/out/SIGNATURE.txt"
          unzip -t "$APK" | tee "$RUNNER_TEMP/out/ZIPTEST.txt"
          cp "$APK" "$RUNNER_TEMP/out/Monstrinhos_v6.8.8_IDIOMA_FINAL.apk"
          sha256sum "$RUNNER_TEMP/out/Monstrinhos_v6.8.8_IDIOMA_FINAL.apk" | tee "$RUNNER_TEMP/out/SHA256SUMS.txt"

      - name: QA PT EN ES sequence and persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            APK="$RUNNER_TEMP/out/Monstrinhos_v6.8.8_IDIOMA_FINAL.apk"
            adb install -r "$APK"
            adb shell am force-stop com.caeless.monstrinhos
            adb shell am start -n com.caeless.monstrinhos/.MainActivity
            sleep 3
            SIZE="$(adb shell wm size | awk -F': ' '{print $2}' | tr -d '\r')"
            W="${SIZE%x*}"; H="${SIZE#*x}"
            tap_pct() { adb shell input tap $((W*$1/1000)) $((H*$2/1000)); sleep 1; }
            snap() { adb exec-out screencap -p > "$RUNNER_TEMP/out/$1"; test -s "$RUNNER_TEMP/out/$1"; }
            tap_pct 940 55
            snap 00_settings_initial.png
            tap_pct 745 670; tap_pct 720 728; snap 01_portugues.png
            tap_pct 745 670; tap_pct 720 780; snap 02_english.png
            tap_pct 745 670; tap_pct 720 830; snap 03_espanol.png
            tap_pct 745 670; tap_pct 720 728; snap 04_portugues.png
            tap_pct 745 670; tap_pct 720 830; snap 05_espanol.png
            tap_pct 745 670; tap_pct 720 780; snap 06_english.png
            adb shell am force-stop com.caeless.monstrinhos
            adb shell am start -n com.caeless.monstrinhos/.MainActivity
            sleep 2
            tap_pct 940 55
            snap 07_restart_english.png
            adb shell run-as com.caeless.monstrinhos cat shared_prefs/monstrinhos_save_v1.xml | tee "$RUNNER_TEMP/out/SAVE_AFTER_RESTART.xml"
            grep -E 'name="language_index" value="1"' "$RUNNER_TEMP/out/SAVE_AFTER_RESTART.xml"
            sha256sum "$RUNNER_TEMP/out/"*.png > "$RUNNER_TEMP/out/SCREENSHOT_SHA256SUMS.txt"

      - name: Export consolidated source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/mon" ]; then
            mkdir -p "$RUNNER_TEMP/out"
            cd "$RUNNER_TEMP/mon"
            zip -qr "$RUNNER_TEMP/out/Monstrinhos_rebuild_v6.8.8_IDIOMA_FINAL_source.zip" . \
              -x 'app/build/*' '.gradle/*' '**/.gradle/*' '**/build/*'
            sha256sum "$RUNNER_TEMP/out/Monstrinhos_rebuild_v6.8.8_IDIOMA_FINAL_source.zip" >> "$RUNNER_TEMP/out/SHA256SUMS.txt"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Monstrinhos-v6.8.8-IDIOMA-FINAL
          path: ${{ runner.temp }}/out/*
          retention-days: 7
