name: Build Monstrinhos v6.8.9 Idioma Touch
on:
  push:
    branches: [ "chatgpt/monstrinhos-v6.8.9-package" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore tested v6.8.8 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v688-artifact" "$RUNNER_TEMP/mon"
          gh run download 35773642567 -R "${{ github.repository }}" -n Monstrinhos-v6.8.8-IDIOMA-UNICO -D "$RUNNER_TEMP/v688-artifact"
          unzip -q "$RUNNER_TEMP/v688-artifact/Monstrinhos_v6.8.8_IDIOMA_UNICO_source.zip" -d "$RUNNER_TEMP/mon"

      - name: Apply v6.8.9 language touch fix
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mon"
          patch -p1 < "$GITHUB_WORKSPACE/ci/v689.patch"

      - name: Regression QA for language selector
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mon"
          python3 tools/verify_release.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/caeless/monstrinhos/MonstrinhosView.java').read_text()
          start=s.rindex('            case 5:')
          end=s.index('            case 6:',start)
          case=s[start:end]
          assert case.index('if(languageMenuOpen)') < case.index('screen=13')
          assert 'x>w*.455f&&x<w*.910f&&y>h*.642f&&y<h*.700f' in case
          assert 'float col=w*(.910f-.455f)/3f;' in case
          assert 'int pick=clamp((int)((x-w*.455f)/col),0,2);' in case
          assert 's.languageIndex=pick;s.save(getContext());languageMenuOpen=false;' in case
          assert '.565f' not in case and '.635f' not in case
          # geometric regression: menu is inside Idioma row (.63-.72) and cannot overlap Acessibilidade (<.63) or Créditos (>.72)
          t,b=.642,.700
          assert t>.63 and b<.72
          gs=Path('app/src/main/java/com/caeless/monstrinhos/GameState.java').read_text()
          assert 'putInt("language_index",languageIndex)' in gs
          assert 'p.getInt("language_index",0)' in gs
          print('OK language touch priority, non-overlap, selection and persistence wiring')
          PY
          echo "Static language UI regression assertions passed"

      - name: Build APK
        run: cd "$RUNNER_TEMP/mon" && gradle :app:assembleDebug --stacktrace

      - name: Align sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mon"
          RAW_APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$RUNNER_TEMP/out"
          ALIGNED="$RUNNER_TEMP/Monstrinhos_v6.8.9_aligned.apk"
          FINAL="$RUNNER_TEMP/out/Monstrinhos_v6.8.9_IDIOMA_TOQUE.apk"
          "$BT/zipalign" -f -v 4 "$RAW_APK" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/app/keystores/monstrinhos-test.jks" \
            --ks-key-alias 'monstrinhos-test' \
            --ks-pass 'pass:monstrinhos-test-only-2026' \
            --key-pass 'pass:monstrinhos-test-only-2026' \
            --out "$FINAL" "$ALIGNED"
          "$BT/aapt" dump badging "$FINAL" | tee "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "name='com.caeless.monstrinhos'" "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "versionCode='6890'" "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "versionName='6.8.9'" "$RUNNER_TEMP/out/BADGING.txt"
          grep -F "targetSdkVersion:'36'" "$RUNNER_TEMP/out/BADGING.txt"
          "$BT/zipalign" -c -v 4 "$FINAL" > "$RUNNER_TEMP/out/ZIPALIGN.txt"
          "$BT/apksigner" verify --verbose --print-certs "$FINAL" | tee "$RUNNER_TEMP/out/SIGNATURE.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: f562b57aa046dbb098922a6dc520f3ff8e1ad190d129c7e61a254588646ce514' "$RUNNER_TEMP/out/SIGNATURE.txt"
          sha256sum "$FINAL" > "$RUNNER_TEMP/out/SHA256SUMS.txt"

      - name: Export consolidated source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mon"
          zip -qr "$RUNNER_TEMP/out/Monstrinhos_v6.8.9_IDIOMA_TOQUE_source.zip" . -x 'app/build/*' '.gradle/*' 'build/*'
          sha256sum "$RUNNER_TEMP/out/Monstrinhos_v6.8.9_IDIOMA_TOQUE_source.zip" >> "$RUNNER_TEMP/out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Monstrinhos-v6.8.9-IDIOMA-TOQUE
          path: ${{ runner.temp }}/out/*
          retention-days: 7
