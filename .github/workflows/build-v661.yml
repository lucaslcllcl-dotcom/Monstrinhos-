name: Build Monstrinhos v6.6.1
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode source
        run: |
          mkdir -p "$RUNNER_TEMP/mon"
          base64 -d ci/Monstrinhos_v6.6.1_source.b64 > "$RUNNER_TEMP/src.zip"
          unzip -q "$RUNNER_TEMP/src.zip" -d "$RUNNER_TEMP/mon"
          cd "$RUNNER_TEMP/mon"
          python3 tools/verify_release.py
      - name: Build APK
        run: cd "$RUNNER_TEMP/mon" && gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          cd "$RUNNER_TEMP/mon"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "name='com.caeless.monstrinhos'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionCode='6610'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='6.6.1'" "$RUNNER_TEMP/badging.txt"
          grep -F "application-label:'Monstrinhos 6.6.1 TESTE'" "$RUNNER_TEMP/badging.txt"
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/Monstrinhos_v6.6.1_TESTE.apk"
          sha256sum "$RUNNER_TEMP/out/Monstrinhos_v6.6.1_TESTE.apk" > "$RUNNER_TEMP/out/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Monstrinhos-v6.6.1-TESTE
          path: ${{ runner.temp }}/out/*
          retention-days: 7
