plugins { id 'com.android.application' }

android {
    namespace 'com.caeless.monstrinhos'
    compileSdk 36

    defaultConfig {
        applicationId 'com.caeless.monstrinhos'
        minSdk 26
        targetSdk 36
        versionCode 5200
        versionName '5.2.0'
        manifestPlaceholders = [ADMOB_APP_ID: (System.getenv('ADMOB_APP_ID') ?: 'ca-app-pub-3940256099942544~3347511713')]
        resValue 'string', 'admob_rewarded_id', '"' + (System.getenv('ADMOB_REWARDED_ID') ?: 'ca-app-pub-3940256099942544/5224354917') + '"'
        resValue 'string', 'admob_interstitial_id', '"' + (System.getenv('ADMOB_INTERSTITIAL_ID') ?: 'ca-app-pub-3940256099942544/1033173712') + '"'
    }

    signingConfigs {
        release {
            def ks = System.getenv('MONSTRINHOS_KEYSTORE')
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv('MONSTRINHOS_STORE_PASSWORD')
                keyAlias System.getenv('MONSTRINHOS_KEY_ALIAS') ?: 'monstrinhos'
                keyPassword System.getenv('MONSTRINHOS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('MONSTRINHOS_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.rc1test'
            versionNameSuffix '-test'
        }
    }
}


dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
}
